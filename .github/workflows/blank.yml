name: Java CI with Lombok

on:
  push:
    branches:
      - main
      - 'sem2/*'
  pull_request:
    branches:
      - main
      - 'sem2/*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean install

      - name: Run tests
        run: mvn test