spring.application.name=demo
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.path=/swagger-ui.html

server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=mypassword

spring.flyway.url=jdbc:postgresql://localhost:5432/mydatabase
spring.flyway.user=myuser
spring.flyway.password=mypassword
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baselineOnMigrate=true

logging.level.com.example.demo.controller=DEBUG
logging.level.com.example.demo.model=DEBUG

resilience4j.ratelimiter.instances.apiRateLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.apiRateLimiter.limit-refresh-period=10s
resilience4j.ratelimiter.instances.apiRateLimiter.timeout-duration=0

resilience4j.circuitbreaker.instances.apiCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.apiCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.apiCircuitBreaker.sliding-window-size=10